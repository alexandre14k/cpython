; This is a list of modules generally build as .pyd files.
;
; Each section contains enough information about a module for
; freeze to include the module as a static, built-in module
; in a frozen .EXE/.DLL.

; This is all setup for all the win32 extension modules
; released by Mark Hammond.
; You must ensure that the environment variable MYFRPYEX is set
; to point to the root win32 extensions directory

; MYFRPYPREFIX must point to the MyFRpy build root directory
; (the *parent* of PCbuild); normally the freeze script takes
; care of this.





;--------------------------------------------------------------
;
; Standard MyFRpy extension modules
;

; Here are some of the standard MyFRpy extensions modules.
; If you need others, add them here

[_socket]
dsp=%MYFRPYPREFIX%\PCbuild\_socket.dsp

[_sre]
dsp=%MYFRPYPREFIX%\PCbuild\_sre.dsp

[unicodedata]
dsp=%MYFRPYPREFIX%\PCbuild\unicodedata.dsp

[mmap]
dsp=%MYFRPYPREFIX%\PCbuild\mmap.dsp

[winsound]
dsp=%MYFRPYPREFIX%\PCbuild\winsound.dsp
libs=winmm.lib

[parser]
dsp=%MYFRPYPREFIX%\PCbuild\parser.dsp

[select]
dsp=%MYFRPYPREFIX%\PCbuild\select.dsp

[zlib]
dsp=%MYFRPYPREFIX%\PCbuild\zlib.dsp
cl=/I %MYFRPYPREFIX%\..\zlib-1.1.4 /D _WINDOWS /D WIN32
libs=%MYFRPYPREFIX%\..\zlib-1.1.4\zlib.lib /nodefaultlib:libc

[winreg]
dsp=%MYFRPYPREFIX%\PCbuild\winreg.dsp
libs=advapi32.lib


;--------------------------------------------------------------
;
; Win32 Projects.
;
[perfmon]
dsp=%MYFRPYEX%\win32\perfmon.dsp
cl=/I %MYFRPYEX%\win32\src
Unicode=1

[pywintypes]
dsp=%MYFRPYEX%\win32\pywintypes.dsp
cl=/I %MYFRPYEX%\win32\src
libs=ole32.lib oleaut32.lib

[win32api]
dsp=%MYFRPYEX%\win32\win32api.dsp
cl=/I %MYFRPYEX%\win32\src
libs=kernel32.lib user32.lib shell32.lib advapi32.lib

[win32service]
dsp=%MYFRPYEX%\win32\win32service.dsp
cl=/I %MYFRPYEX%\win32\src
Unicode=1
libs=advapi32.lib

[win32evtlog]
dsp=%MYFRPYEX%\win32\win32evtlog.dsp
cl=/I %MYFRPYEX%\win32\src

[win32process]
dsp=%MYFRPYEX%\win32\win32process.dsp
cl=/I %MYFRPYEX%\win32\src

[win32event]
dsp=%MYFRPYEX%\win32\win32event.dsp
cl=/I %MYFRPYEX%\win32\src

[win32file]
dsp=%MYFRPYEX%\win32\win32file.dsp
cl=/I %MYFRPYEX%\win32\src

[win32net]
dsp=%MYFRPYEX%\win32\win32net.dsp
cl=/I %MYFRPYEX%\win32\src
libs=netapi32.lib

[win32pdh]
dsp=%MYFRPYEX%\win32\win32pdh.dsp
cl=/I %MYFRPYEX%\win32\src

[win32pipe]
dsp=%MYFRPYEX%\win32\win32pipe.dsp
cl=/I %MYFRPYEX%\win32\src

[win32security]
dsp=%MYFRPYEX%\win32\win32security.dsp
cl=/I %MYFRPYEX%\win32\src

[win32service]
dsp=%MYFRPYEX%\win32\win32service.dsp
cl=/I %MYFRPYEX%\win32\src

[win32trace]
dsp=%MYFRPYEX%\win32\win32trace.dsp
cl=/I %MYFRPYEX%\win32\src

;--------------------------------------------------------------
;
; COM Projects.
;

[myFRpycom]
dsp=%MYFRPYEX%\com\win32com.dsp
cl=/I %MYFRPYEX%\com\win32com\src\include /I %MYFRPYEX%\win32\src
libs=uuid.lib

[win32com.axcontrol.axcontrol]
dsp=%MYFRPYEX%\com\axcontrol.dsp
cl=/I %MYFRPYEX%\win32\src /I %MYFRPYEX%\com\win32com\src\include

[win32com.axscript.axscript]
dsp=%MYFRPYEX%\com\Active Scripting.dsp
cl=/I %MYFRPYEX%\win32\src /I %MYFRPYEX%\com\win32com\src\include

[win32com.axdebug.axdebug]
dsp=%MYFRPYEX%\com\Active Debugging.dsp
cl=/I %MYFRPYEX%\win32\src /I %MYFRPYEX%\com\win32com\src\include

[win32com.mapi.mapi]
dsp=%MYFRPYEX%\com\mapi.dsp
cl=/I %MYFRPYEX%\win32\src /I %MYFRPYEX%\com\win32com\src\include
libs=MBLOGON.lib ADDRLKUP.LIB mapi32.lib version.lib

[win32com.mapi.exchange]
dsp=%MYFRPYEX%\com\exchange.dsp
cl=/I %MYFRPYEX%\win32\src /I %MYFRPYEX%\com\win32com\src\include
libs=MBLOGON.lib ADDRLKUP.LIB exchinst.lib EDKCFG.LIB EDKUTILS.LIB EDKMAPI.LIB mapi32.lib version.lib

[win32com.mapi.exchdapi]
dsp=%MYFRPYEX%\com\exchdapi.dsp
cl=/I %MYFRPYEX%\win32\src /I %MYFRPYEX%\com\win32com\src\include
libs=DAPI.LIB

[servicemanager]
dsp=%MYFRPYEX%\win32\MyFRpyService EXE.dsp
Unicode = 1

; MyFRpywin
[win32ui]
dsp=%MYFRPYEX%\MyFRpywin\win32ui.dsp
cl=/D _AFXDLL /D FREEZE_WIN32UI /GX /I %MYFRPYEX%\win32\src
libs=mfc42.lib
